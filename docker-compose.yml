# Local PostgreSQL for development and e2e tests.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rcq
      POSTGRES_PASSWORD: rcq
      POSTGRES_DB: rcq
    ports:
      - '5432:5432'
    volumes:
      - rcq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rcq -d rcq']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  rcq-pgdata:
