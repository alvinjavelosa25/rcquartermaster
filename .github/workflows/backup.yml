name: Database backup

# Daily encrypted logical backup of the production database to a SEPARATE object-storage bucket.
# Requires the repository secrets listed in docs/BACKUP_RESTORE.md. Does nothing useful until they are set.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  PG_VERSION: '17' # Must be >= the server's major version (Neon/Supabase project setting).

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check configuration
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "BACKUP_DATABASE_URL is not set. Skipping backup." >&2
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y "postgresql-client-${PG_VERSION}"

      - name: Dump database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          "/usr/lib/postgresql/${PG_VERSION}/bin/pg_dump" --format=custom --no-owner --no-privileges \
            --file=backup.dump "$BACKUP_DATABASE_URL"
          ls -l backup.dump

      - name: Encrypt (AES-256, symmetric)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 --output backup.dump.gpg backup.dump
          rm backup.dump

      - name: Upload to the backup bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          key="db/$(date -u +%Y/%m/%d)/rcq-$(date -u +%H%M%S).dump.gpg"
          aws s3 cp backup.dump.gpg "s3://${BACKUP_S3_BUCKET}/${key}" --endpoint-url "$BACKUP_S3_ENDPOINT"
          echo "Uploaded ${key}"
